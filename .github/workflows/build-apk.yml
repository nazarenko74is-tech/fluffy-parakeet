name: Build SEGA MASTER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore SEGA MASTER visual asset
        run: |
          mkdir -p app/src/main/res/drawable
          python3 - <<'PY'
          import base64, pathlib, re
          s = pathlib.Path('app/src/main/assets/sega_master.webp.b64').read_text()
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          s += '=' * ((4 - len(s) % 4) % 4)
          data = base64.b64decode(s, validate=False)
          pathlib.Path('app/src/main/res/drawable/sega_master.webp').write_bytes(data)
          print('decoded bytes:', len(data))
          PY
          rm -f app/src/main/assets/sega_master.webp.b64
          file app/src/main/res/drawable/sega_master.webp
          ls -lh app/src/main/res/drawable/sega_master.webp

      - name: Build debug APK
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains SEGA MASTER asset
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'sega_master|classes.dex|AndroidManifest.xml'

      - uses: actions/upload-artifact@v4
        with:
          name: sega-master-v1-original-visual
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
